services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saas_crawler}
      POSTGRES_USER: ${POSTGRES_USER:-crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crawler}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crawler} -d ${POSTGRES_DB:-saas_crawler}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  migrate:
    build:
      context: .
      target: api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crawler}:${POSTGRES_PASSWORD:-crawler}@postgres:5432/${POSTGRES_DB:-saas_crawler}
    depends_on:
      postgres:
        condition: service_healthy

  backend-api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crawler}:${POSTGRES_PASSWORD:-crawler}@postgres:5432/${POSTGRES_DB:-saas_crawler}
      REDIS_URL: redis://redis:6379/0
      CRAWLER_SECRET_KEY: ${CRAWLER_SECRET_KEY:-change-me-local-dev-key}
      DATA_DIR: /app/data
      CHECKPOINT_DIR: /app/checkpoints
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  worker:
    build:
      context: .
      target: browser-worker
    command: ["python", "-m", "saas_crawler.tasks.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crawler}:${POSTGRES_PASSWORD:-crawler}@postgres:5432/${POSTGRES_DB:-saas_crawler}
      REDIS_URL: redis://redis:6379/0
      CRAWLER_SECRET_KEY: ${CRAWLER_SECRET_KEY:-change-me-local-dev-key}
      DATA_DIR: /app/data
      CHECKPOINT_DIR: /app/checkpoints
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints

  login-worker:
    build:
      context: .
      target: browser-worker
    command: ["python", "-m", "saas_crawler.accounts.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crawler}:${POSTGRES_PASSWORD:-crawler}@postgres:5432/${POSTGRES_DB:-saas_crawler}
      REDIS_URL: redis://redis:6379/0
      CRAWLER_SECRET_KEY: ${CRAWLER_SECRET_KEY:-change-me-local-dev-key}
      DATA_DIR: /app/data
      CHECKPOINT_DIR: /app/checkpoints
      LOGIN_HEADLESS: ${LOGIN_HEADLESS:-1}
      LOGIN_TIMEOUT_SECONDS: ${LOGIN_TIMEOUT_SECONDS:-600}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-5174}:80"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend
    ports:
      - "${NGINX_PORT:-8080}:80"

volumes:
  postgres_data:
